name: S3 + CloudFront Terraform Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - develop
      confirm:
        description: "Type the environment name exactly to confirm destruction"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
  HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
  TERRAFORM_VERSION: "1.15.8"
  TERRAGRUNT_VERSION: "1.1.1"

jobs:
  validate-and-plan:
    # Pull requests targeting main: format/lint/validate/plan only. Never applies.
    # NOTE: PRs from forks don't get repo secrets/OIDC by default on the
    # `pull_request` event — this job will fail auth for fork PRs. That's a
    # deliberate GitHub security default, not a bug; see readme.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Cancel a superseded plan when new commits land on the same PR branch —
    # otherwise two overlapping runs can race on the same state's S3 lock and
    # leave an orphaned lock behind when the older run gets killed mid-plan.
    concurrency:
      group: tf-plan-${{ github.head_ref }}-${{ matrix.environment }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Scoped to develop only for now. Add staging/production back to this
      # list once we're ready to deploy those environments too.
      matrix:
        environment: [develop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: tflint --recursive

      - name: Terragrunt validate
        working-directory: environment/${{ matrix.environment }}
        run: terragrunt validate --all --non-interactive

      # Plans each unit individually (not run-all) so a unit with zero diff
      # can be reported as "no changes" instead of dumping a full plan for
      # something that isn't going to change. -detailed-exitcode: 0 = no
      # changes, 2 = changes, 1 = real error (fails the step immediately).
      - name: Terragrunt plan (per unit)
        id: plan
        working-directory: environment/${{ matrix.environment }}
        continue-on-error: true
        run: |
          set -e
          BODY_FILE="$(pwd)/pr_comment_body.md"
          echo "### Terraform Plan — \`${{ matrix.environment }}\`" > "$BODY_FILE"
          echo >> "$BODY_FILE"

          for unit in s3 acm cloudfront; do
            echo "::group::${unit}"
            pushd "$unit" > /dev/null
            set +e
            terragrunt plan -detailed-exitcode --non-interactive -no-color > plan_output.txt 2>&1
            code=$?
            set -e
            popd > /dev/null
            echo "::endgroup::"

            if [ "$code" -eq 0 ]; then
              echo "- **${unit}**: no changes" >> "$BODY_FILE"
            elif [ "$code" -eq 2 ]; then
              {
                echo "<details><summary><strong>${unit}</strong>: changes detected</summary>"
                echo
                echo '```hcl'
                cat "${unit}/plan_output.txt"
                echo '```'
                echo "</details>"
                echo
              } >> "$BODY_FILE"
            else
              {
                echo "- **${unit}**: plan FAILED"
                echo '```'
                cat "${unit}/plan_output.txt"
                echo '```'
              } >> "$BODY_FILE"
              exit 1
            fi
          done

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'environment/${{ matrix.environment }}/pr_comment_body.md';
            let body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `### Terraform Plan — \`${{ matrix.environment }}\`\n\n(no output captured — the plan step likely failed before writing anything)`;

            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n... (truncated)';
            }

            const marker = `<!-- terraform-plan-${{ matrix.environment }} -->`;
            body = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    # Push to main (i.e. a PR merge, assuming main is branch-protected against
    # direct pushes). Scoped to develop only for now — add staging/production
    # back to the matrix below once we're ready to deploy those environments
    # too. `environment:` ties this job to a GitHub Environment so
    # `production` can later carry a required-reviewer protection rule
    # (configured manually in repo settings — Terraform/Terragrunt cannot
    # create this).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never cancel an in-flight apply — a second push to main while one is
    # running queues behind it instead of racing/killing it mid-apply, which
    # is what actually caused the stale S3 state lock we hit on 2026-07-31.
    concurrency:
      group: tf-apply-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [develop]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Applies each unit individually (not run-all) and only if that unit's
      # own plan shows a diff — a unit with nothing to change is skipped
      # entirely, it is never "applied" just to no-op.
      - name: Terragrunt plan + apply (per unit, changes only)
        working-directory: environment/${{ matrix.environment }}
        run: |
          set -e
          for unit in s3 acm cloudfront; do
            echo "::group::${unit}"
            pushd "$unit" > /dev/null
            set +e
            terragrunt plan -detailed-exitcode --non-interactive -no-color > plan_output.txt 2>&1
            code=$?
            set -e

            case "$code" in
              0)
                echo "${unit}: no changes — skipping apply"
                ;;
              2)
                echo "${unit}: changes detected — applying"
                terragrunt apply --non-interactive -auto-approve
                ;;
              *)
                echo "${unit}: terragrunt plan failed"
                cat plan_output.txt
                popd > /dev/null
                echo "::endgroup::"
                exit 1
                ;;
            esac
            popd > /dev/null
            echo "::endgroup::"
          done

  destroy:
    # Manual only — never fires on push/pull_request. Requires typing the
    # environment name into the `confirm` input as a deliberate guardrail
    # against destroying infrastructure by an accidental workflow_dispatch
    # click. Ties to the same GitHub Environment as `apply` so any
    # required-reviewer protection rule applies here too.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    # Shares the apply job's concurrency group so a destroy can never race
    # an in-flight apply (or another destroy) against the same environment.
    concurrency:
      group: tf-apply-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Verify confirmation input matches environment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "::error::Confirmation text '${{ github.event.inputs.confirm }}' does not match environment '${{ github.event.inputs.environment }}'. Aborting — nothing was destroyed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Reverse dependency order: cloudfront depends on s3 + acm, so it must
      # be destroyed first, or destroying s3/acm first leaves cloudfront
      # referencing resources that no longer exist.
      - name: Terragrunt destroy (reverse dependency order)
        working-directory: environment/${{ github.event.inputs.environment }}
        run: |
          set -e
          for unit in cloudfront acm s3; do
            echo "::group::${unit}"
            pushd "$unit" > /dev/null
            terragrunt destroy --non-interactive -auto-approve
            popd > /dev/null
            echo "::endgroup::"
          done
